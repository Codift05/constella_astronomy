# Membangun .ipa Constella di runner macOS, karena Flutter tidak bisa
# membangun iOS dari Linux: SDK Linux-nya tidak memuat artefak engine iOS
# maupun gen_snapshot iOS, dan `flutter build` di sana hanya mengenal
# apk/appbundle/aar/bundle/linux/web.
#
# Hasilnya .ipa TANPA tanda tangan. Penandatanganan dilakukan di mesin Fedora
# oleh xtool saat memasang:
#
#     xtool install constella-unsigned.ipa
#
# xtool memakai Apple ID biasa, jadi tidak perlu akun developer berbayar.
# Catatan: aplikasi yang ditandatangani Apple ID gratis kedaluwarsa setelah
# 7 hari dan harus dipasang ulang.

name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    # Dibutuhkan untuk menerbitkan .ipa sebagai aset release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Dikunci ke versi yang dipakai di mesin lokal, supaya hasil CI dan
          # hasil lokal tidak berbeda diam-diam.
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Ambil dependensi
        working-directory: app
        run: flutter pub get

      - name: Bangun berkas terjemahan
        working-directory: app
        run: flutter gen-l10n

      - name: Analisis statis
        working-directory: app
        run: flutter analyze

      # Tes dijalankan sebelum build: lebih baik gagal di sini selama 1 menit
      # daripada setelah 20 menit kompilasi iOS.
      - name: Tes
        working-directory: app
        run: flutter test

      - name: Bangun Runner.app tanpa tanda tangan
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Bungkus jadi .ipa
        working-directory: app
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry constella-unsigned.ipa Payload
          rm -rf Payload
          ls -lh constella-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: constella-ios-unsigned
          path: app/constella-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # Dijalankan saat dipicu tag. Artifact biasa butuh token API untuk
      # diunduh; aset release di repo publik bisa diambil langsung dengan
      # curl, sehingga pemasangan ke iPhone bisa berjalan tanpa campur tangan.
      - name: Terbitkan .ipa sebagai release
        if: startsWith(github.ref, 'refs/tags/ios-')
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" constella-unsigned.ipa \
            --title "Constella iOS $GITHUB_REF_NAME" \
            --notes "Build tanpa tanda tangan dari commit $GITHUB_SHA.
          Pasang dengan: xtool install constella-unsigned.ipa"

